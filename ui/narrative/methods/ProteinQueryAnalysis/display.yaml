name: Protein Query Analysis v2.0
tooltip: Protein analysis pipeline with embeddings, similarity, families, and reports

parameters:
    input_type:
        ui-name: Input Type
        short-hint: Choose input source
        description: |
            Options:
            - uniprot_ids: One or more UniProt IDs (e.g., P12345)
            - fasta_file: Upload a FASTA file
            - workspace_object_ref: Reference to a workspace object
            - sequence: Raw protein sequence

    input_proteins:
        ui-name: Input Proteins
        short-hint: List of proteins (optional)
        description: |
            Optional list input. Prefer using input_type + input_data for clarity.

    uniprot_ids:
        ui-name: UniProt Identifiers
        short-hint: UniProt IDs (e.g., P12345)
        description: |
            Enter one or more UniProt IDs (comma or newline separated).

    fasta_file:
        ui-name: FASTA File
        short-hint: Upload FASTA
        description: |
            Protein sequences in standard FASTA format.

    workspace_object:
        ui-name: Workspace Object Reference
        short-hint: Reference to a workspace object
        description: |
            Supported types include Genome, GenomeSet, ProteinSequenceSet, FeatureSet.

    direct_sequences:
        ui-name: Sequence
        short-hint: Raw protein sequence
        description: |
            One sequence per line or comma-separated. Use amino acids A–Y.

    analysis_type:
        ui-name: Analysis Type
        short-hint: What to run
        description: |
            comprehensive | sequence_only | similarity_only | network_only | check_existence

    enabled_stages:
        ui-name: Enabled Stages
        short-hint: Pipeline stages
        description: |
            Enable specific stages (e.g., embedding_generation, family_assignment, similarity_search, report_generation).

    stop_after_stage:
        ui-name: Stop After Stage
        short-hint: Stop after
        description: |
            Optional. Stop after a specific stage.

    input_data:
        ui-name: Input Data
        short-hint: Data matching input_type
        description: |
            Provide data for the selected input_type.

    output_directory:
        ui-name: Output Directory
        short-hint: Directory name for files
        description: |
            Folder name to organize exported files.

    output_analysis_name:
        ui-name: Output Analysis Name
        short-hint: Analysis object name
        description: |
            Name of the workspace analysis object.

    output_data:
        ui-name: Output Data Object Name
        short-hint: Data object name
        description: |
            Name of the workspace data object.

description: |
    Unified protein analysis: embeddings, families, similarity search, sequence metrics, networks, and reports. Simple inputs, organized outputs, KBase-ready.

screenshots:
    - protein_query_analysis_dashboard.png
    - protein_query_analysis_detail.png

publications:
    - doi: 10.1038/s41592-022-01465-8
      display-text: "ESM-2: Language models of protein sequences"
    - doi: 10.1093/bioinformatics/btab653
      display-text: "FAISS: A library for efficient similarity search"

