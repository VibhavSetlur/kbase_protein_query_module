name: Protein Query Analysis
tooltip: Protein query analysis pipeline
screenshots: []

parameters:
    input_type:
        ui-name: Input Type
        short-hint: Select input type

    protein_input:
        ui-name: Protein Input
        short-hint: Protein sequences or FASTA content
        description: |
            Enter protein sequences directly or paste FASTA content.
            Supports both raw sequences and FASTA format with headers.

    uniprot_ids:
        ui-name: UniProt IDs
        short-hint: UniProt protein identifiers
        description: |
            Enter UniProt protein identifiers (e.g., P12345, Q67890).
            Uses stored embeddings if available, otherwise generates new ones.

    workspace_object:
        ui-name: Workspace Object
        short-hint: Select workspace object
        description: |
            Choose a workspace object containing protein data.
            Supported types: Genome, GenomeSet, ProteinSequenceSet

    analysis_name:
        ui-name: Analysis Name
        short-hint: Name for analysis

description: |
    Protein query analysis pipeline


