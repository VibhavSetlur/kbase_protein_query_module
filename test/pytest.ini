[tool:pytest]
# Pytest configuration for KBase Protein Query Module tests

# Test discovery
testpaths = unit_tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output configuration
addopts = 
    --strict-markers
    --strict-config
    --tb=short
    --disable-warnings
    --color=yes

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    functional: End-to-end functional tests
    kbase: KBase compliance and standards tests
    server: KBase server tests
    slow: Tests that take longer to run
    network: Tests that require network access
    mock: Tests that use mocking extensively

# Minimum version requirements
minversion = 6.0

# Test timeout (in seconds)
timeout = 300

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:pandas.*
    ignore::UserWarning:numpy.*

# Coverage configuration (if pytest-cov is available)
[coverage:run]
source = ../../lib
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError

